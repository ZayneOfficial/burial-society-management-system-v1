<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CBS PORTAL">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/cbs-favicon.png">
  <link rel="icon" type="image/png" href="/images/cbs-favicon.png">
  <title>Burial Society - Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="/app.js" defer></script>
</head>
<body class="login-page">
  <div id="loadingScreen" role="status" aria-label="CBS PORTAL, developed by Zayne">
    <div class="loading-box">
      <img src="/images/cbs.png" alt="Cape Town Burial Society Logo" class="loading-logo">
      <h2>CBS PORTAL</h2>
      <small>DEVELOPED BY ZAYNE</small>
    </div>
  </div>
  <main class="login-card">
    <div class="brand">
      <div class="brand-icon">
  <img src="/images/cbs.png" alt="Cape Town Burial Society Logo">
</div>
      <div>
        <h1>Burial Society</h1>
        <p>Management System</p>
      </div>
    </div>

    <button id="installApp" class="btn btn-primary btn-large" type="button" hidden>Install app</button>
    <p id="installHelp" class="hint" hidden>Tap Share in Safari, then choose “Add to Home Screen”.</p>

    <div class="tabs">
  <button class="tab active" data-tab="admin">Admin Login</button>
  <button class="tab" data-tab="member">Member Login</button>
  <button class="tab" data-tab="helper">Helper Login</button>
</div>

    <section id="admin-login" class="login-panel">
      <form id="adminForm">
        <label>Email</label>
        <input id="adminEmail" type="email" placeholder="Admin email" required>
        <label>Password</label>
        <input id="adminPassword" type="password" placeholder="Password" required>
        <button class="btn btn-dark btn-large" type="submit">Login as Admin</button>
      </form>
    </section>

    <section id="member-login" class="login-panel hidden">
      <form id="memberForm">
        <label>VN Number</label>
        <input id="memberVN" placeholder="VN001" required>

        <label>Full Name</label>
        <input id="memberFullName" placeholder="John Smith" autocomplete="name" required>
        <button class="btn btn-primary btn-large" type="submit">Login as Member</button>
        <p id="memberLoginMessage" class="message error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="helper-login" class="login-panel hidden">
  <form id="helperForm">
    <label>VN Number</label>
    <input id="helperVN" placeholder="VN001" required>

    <label>Full Name</label>
    <input id="helperName" placeholder="John Smith" required>

    <label>Helper Password</label>
    <input id="helperPassword" type="password" required>

    <button class="btn btn-primary btn-large" type="submit">
      Login as Helper
    </button>
  </form>
</section>

   
  </main>

<script>
const tabs = document.querySelectorAll(".tab");
tabs.forEach(tab => tab.addEventListener("click", () => {
  tabs.forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById("admin-login").classList.toggle("hidden", tab.dataset.tab !== "admin");
document.getElementById("member-login").classList.toggle("hidden", tab.dataset.tab !== "member");
document.getElementById("helper-login").classList.toggle("hidden", tab.dataset.tab !== "helper");
}));

const message = document.getElementById("loginMessage");
function showMessage(text, ok=false) {
  message.textContent = text;
  message.className = "message " + (ok ? "success" : "error");
}

document.getElementById("adminForm").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        email: adminEmail.value,
        password: adminPassword.value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    localStorage.setItem("session", JSON.stringify({ role:"admin", admin:data.admin }));
    location.href = "/admin.html";
  } catch (err) { showMessage(err.message); }
});

document.getElementById("memberForm").addEventListener("submit", async e => {
  e.preventDefault();
  const memberLoginMessage = document.getElementById("memberLoginMessage");
  memberLoginMessage.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
     body: JSON.stringify({
  role: "member",
  vn_number: memberVN.value.trim(),
  full_name: memberFullName.value.trim()
})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    localStorage.setItem("session", JSON.stringify({
      role:"member",
      member_id:data.member.member_id,
      vn_number:data.member.vn_number,
      member:data.member
    }));
    location.href = "/member.html";
  } catch (err) {
    memberLoginMessage.textContent = err.message;
  }
});

document.getElementById("helperForm").addEventListener("submit", async e => {
  e.preventDefault();

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        vn_number: helperVN.value,
        full_name: helperName.value,
        helper_password: helperPassword.value
      })
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.message);

    localStorage.setItem("session", JSON.stringify({
      role: "helper",
      helper_id: data.helper.helper_id,
      member_id: data.helper.member_id,
      vn_number: data.helper.vn_number,
      helper: data.helper
    }));

    location.href = "/helper.html";

  } catch (err) {
    showMessage(err.message);
  }
});

window.addEventListener("load", () => {
  const loader = document.getElementById("loadingScreen");
  if (!loader) return;

  setTimeout(() => {
    loader.classList.add("launch-screen-hidden");
    loader.addEventListener("transitionend", () => loader.remove(), { once: true });
  }, 5000);
}, { once: true });
</script>
</body>
</html>
